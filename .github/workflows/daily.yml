name: Daily data update
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

env:
  COROS_REGION: eu

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install httpx coros-training-mcp python-dotenv

      - name: Restore Coros auth cache
        id: cache-auth
        uses: actions/cache@v4
        with:
          path: coros_auth.json
          key: coros-auth-prod

      - name: Fetch data (Coros)
        id: coros-fetch
        continue-on-error: true
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          COROS_AUTH_CACHE: coros_auth.json
        run: python fetch_coros.py 2>&1 | tee debug.log

      - name: Merge Strava activities
        id: strava-merge
        continue-on-error: true
        run: python merge_strava.py activities.csv 2>&1 | tee -a debug.log

      - name: Create issue on Coros fetch failure
        if: steps.coros-fetch.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Coros fetch failed – ' + new Date().toISOString().slice(0,10);
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'coros-fetch-failure'
            });
            if (existing.data.some(i => i.title === title)) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `Coros API fetch failed in [run ${context.runId}](${runUrl}).\n\nCheck \`debug.log\` in the workflow artifacts for details.\n\nPossible causes:\n- Auth token expired (re-login needed)\n- Coros API downtime\n- Network issue`,
              labels: ['coros-fetch-failure']
            });

      - name: Create issue on Strava merge failure
        if: steps.strava-merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ Strava merge failed – ' + new Date().toISOString().slice(0,10);
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'strava-merge-failure'
            });
            if (existing.data.some(i => i.title === title)) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `Strava merge failed in [run ${context.runId}](${runUrl}).\n\nCheck \`debug.log\` in the workflow artifacts for details.`,
              labels: ['strava-merge-failure']
            });

      - name: Ensure at least a minimal data.json exists for the deploy
        run: |
          if [ ! -f data.json ]; then
            echo '{"_syncedAt":"","days":[]}' > data.json
            echo "Created empty data.json (fetch must have failed)"
          fi

      - name: Prepare deploy folder
        run: |
          mkdir -p _site
          cp index.html _site/ 2>/dev/null || true
          [ -f data.json ] && cp data.json _site/ || true
          [ -f debug.log ] && cp debug.log _site/ 2>/dev/null || true
          [ -f netlify.toml ] && cp netlify.toml _site/ || true

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: python3 deploy.py
