name: Daily data update
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  COROS_REGION: eu

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install httpx coros-training-mcp python-dotenv

      - name: Restore Coros auth cache
        id: cache-auth
        uses: actions/cache@v4
        with:
          path: coros_auth.json
          key: coros-auth-prod

      - name: Show data.json timestamp before
        run: |
          echo "Before fetch: $(head -c 50 data.json 2>/dev/null || echo 'no file')"

      - name: Fetch data (Coros) — may fail if Coros API unavailable
        continue-on-error: true
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          COROS_AUTH_CACHE: coros_auth.json
        run: python fetch_coros.py 2>&1 | tee debug.log

      - name: Show data.json timestamp after
        run: |
          echo "After fetch: $(head -c 50 data.json 2>/dev/null || echo 'no file')"

      - name: Merge Strava activities
        continue-on-error: true
        run: python merge_strava.py activities.csv 2>&1 | tee -a debug.log

      - name: Ensure at least a minimal data.json exists for the deploy
        run: |
          if [ ! -f data.json ]; then
            echo '{"_syncedAt":"","days":[]}' > data.json
            echo "Created empty data.json (fetch must have failed)"
          fi

      - name: Prepare deploy folder
        run: |
          mkdir -p _site
          cp index.html _site/ 2>/dev/null || true
          [ -f data.json ] && cp data.json _site/ || true
          [ -f debug.log ] && cp debug.log _site/ 2>/dev/null || true
          [ -f netlify.toml ] && cp netlify.toml _site/ || true
          echo "=== _site contents ===" && ls -la _site/ && echo "=== _site/data.json line 1 ===" && head -1 _site/data.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install netlify-cli
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          echo "Deploying to Netlify..."
          netlify deploy --prod --dir=_site --site=${{ secrets.NETLIFY_SITE_ID }} --message="Daily data update $(date -u +%F)" --json 2>&1 | tee deploy-result.json
          echo "=== Deploy result ==="
          cat deploy-result.json
          # Copy result to _site so it's visible in the deployed debug log
          cp deploy-result.json _site/ 2>/dev/null || true
