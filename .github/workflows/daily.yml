name: Daily data update
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  COROS_REGION: eu

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install httpx coros-training-mcp python-dotenv

      - name: Restore Coros auth cache
        id: cache-auth
        uses: actions/cache@v4
        with:
          path: coros_auth.json
          key: coros-auth-prod

      - name: Fetch data (Coros) — may fail if Coros API unavailable
        continue-on-error: true
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          COROS_AUTH_CACHE: coros_auth.json
        run: python fetch_coros.py 2>&1 | tee debug.log

      - name: Merge Strava activities
        continue-on-error: true
        run: python merge_strava.py activities.csv 2>&1 | tee -a debug.log

      - name: Ensure at least a minimal data.json exists for the deploy
        run: |
          if [ ! -f data.json ]; then
            echo '{"_syncedAt":"","days":[]}' > data.json
            echo "Created empty data.json (fetch must have failed)"
          fi

      - name: Prepare deploy folder
        run: |
          mkdir -p _site
          cp index.html _site/ 2>/dev/null || true
          [ -f data.json ] && cp data.json _site/ || true
          [ -f debug.log ] && cp debug.log _site/ 2>/dev/null || true
          [ -f netlify.toml ] && cp netlify.toml _site/ || true

      - name: Debug – list files and check zip
        run: |
          echo "=== _site contents ==="
          ls -la _site/
          echo "=== zip availability ==="
          which zip || echo "zip NOT FOUND"
          echo "=== data.json syncedAt ==="
          python3 -c "import json; d=json.load(open('_site/data.json')); print(d.get('_syncedAt','UNKNOWN'))"
          echo "=== data.json day count ==="
          python3 -c "import json; d=json.load(open('_site/data.json')); print(len(d.get('days',[]))); print('days:', sorted(set(str(x['ds']) for x in d.get('days',[])))[-3:])"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -e
          cd _site && zip -r ../site.zip .
          cd ..
          HTTP_CODE=$(curl -X POST --fail -w "%{http_code}" -s -o deploy-result.json \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @site.zip \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys")
          echo "HTTP_CODE=$HTTP_CODE"
          cat deploy-result.json
          python3 -c "import json,sys;r=json.load(open('deploy-result.json'));d=r.get('deploy',r);print('state:%s'%d.get('state'));print('published:%s'%d.get('published'));print('url:%s'%d.get('ssl_url')or d.get('url'));print('created:%s'%d.get('created_at'));print('files:%d'%len(d.get('files',{})))"
